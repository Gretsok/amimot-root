services:
  postgres:
    restart: unless-stopped

  backend:
    restart: unless-stopped
    # no ports — reachable only via amimot-net as "backend"

  frontend:
    restart: unless-stopped
    volumes:
      - ./deploy/Caddyfile.prod:/etc/caddy/Caddyfile:ro
    ports: !override
      - "127.0.0.1:8081:80"
