name: Tests

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened]
  workflow_call: {}

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: amimot
          POSTGRES_PASSWORD: amimot
          POSTGRES_DB: amimot_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U amimot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://amimot:amimot@localhost:5433/amimot_test
      JWT_SECRET: ci-test-secret-not-for-production
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Run migrations
        working-directory: backend
        run: npx prisma migrate deploy

      - name: Run tests
        working-directory: backend
        run: npm test

  backend-docker-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Build backend image
        run: docker build -t amimot-backend-ci ./backend

      # backend-tests et e2e-tests tournent tous deux depuis l'arbre source
      # checkouté (`node src/server.js`), jamais depuis l'image construite :
      # un fichier lu au runtime mais absent du `COPY` du Dockerfile est
      # invisible à toute la suite, quelle que soit sa couverture logique.
      # C'est exactement ce qui a cassé le jeu en prod le 2026-08-18 (le
      # dictionnaire de wordExists() manquait dans l'image). Ce job construit
      # l'image réellement déployée et vérifie que ses assets runtime
      # attendus y sont bien présents.
      - name: Verify runtime assets shipped in the image
        run: |
          if ! docker run --rm amimot-backend-ci test -s /app/data/dictionary/liste_francais.txt; then
            echo "::error::data/dictionary/liste_francais.txt manquant (ou vide) dans l'image backend construite — vérifier le COPY dans backend/Dockerfile"
            exit 1
          fi

  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Run tests
        working-directory: frontend
        run: npm test

  e2e-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: amimot
          POSTGRES_PASSWORD: amimot
          POSTGRES_DB: amimot_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U amimot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run backend migrations
        working-directory: backend
        env:
          DATABASE_URL: postgresql://amimot:amimot@localhost:5433/amimot_test
        run: npx prisma migrate deploy

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run E2E suite
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
