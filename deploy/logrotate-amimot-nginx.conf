# Rotation des journaux nginx de l'HÔTE (celui qui termine le TLS devant le
# conteneur Caddy) — ces journaux contiennent des adresses IP, donc des données
# personnelles : sans rotation, elles sont conservées indéfiniment, ce qui
# contredit la politique de confidentialité.
#
# Les journaux des conteneurs Docker sont déjà plafonnés côté docker-compose.yml
# (json-file, 10 Mo x 3) : ce fichier ne concerne QUE le nginx de l'hôte.
#
# NON INSTALLÉ AUTOMATIQUEMENT. À copier sur le serveur :
#   sudo cp deploy/logrotate-amimot-nginx.conf /etc/logrotate.d/amimot-nginx
#   sudo logrotate -d /etc/logrotate.d/amimot-nginx   # simulation, ne modifie rien
#   sudo logrotate -f /etc/logrotate.d/amimot-nginx   # forcer une première rotation
#
# Attention : la plupart des distributions fournissent déjà /etc/logrotate.d/nginx.
# Vérifier d'abord son contenu — deux configurations couvrant les mêmes fichiers
# se marchent dessus. Soit adapter celle qui existe, soit restreindre les chemins
# ci-dessous aux seuls journaux d'Amimot.

/var/log/nginx/amimot-*.log {
    daily
    # 30 jours : durée à reporter dans docs/rgpd-registre-traitements.md
    # (traitement n° 3). Si elle change ici, elle doit changer là-bas.
    rotate 30
    missingok
    notifempty
    compress
    delaycompress
    # Les journaux archivés restent lisibles par le seul administrateur.
    create 0640 www-data adm
    sharedscripts
    postrotate
        # Réouverture des fichiers sans interrompre le service.
        [ -f /var/run/nginx.pid ] && kill -USR1 "$(cat /var/run/nginx.pid)"
    endscript
}
